# Avisos de atualização de dependências (M5 da revisão de segurança). As PRs passam pelos testes como qualquer outra.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    # @types/node acompanha o Node da indexação (.nvmrc = 22): tipos de versão maior aprovariam funções que
    # o Node 22 não tem. Ao trocar o .nvmrc, troque também esta linha.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      desenvolvimento: { dependency-type: development }
      producao: { dependency-type: production }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
