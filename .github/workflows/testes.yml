name: testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w widget
      - name: Conferir que o widget gerado está atualizado
        run: git diff --exit-code worker-resposta/src/widget-gerado.ts
      - run: npm run typecheck
      - run: npm test
