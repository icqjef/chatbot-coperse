name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: publicar

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w widget
      - name: Conferir que o widget gerado está atualizado
        run: git diff --exit-code worker-resposta/src/widget-gerado.ts
      - run: npm run typecheck
      - run: npm test

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker-resposta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Aplicar migrations do D1
        run: npx wrangler d1 migrations apply chatbot-coperse --remote
      - name: Publicar Worker
        run: npx wrangler deploy
