name: resumo-semanal

# Toda segunda às 08h de Brasília (11h UTC): abre uma issue com o resumo da semana anterior e fecha a
# da semana passada. O GitHub avisa por e-mail quem acompanha o repositório.
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ler o banco e montar o resumo
        id: montar
        run: echo "titulo=$(npx tsx worker-indexacao/src/resumo.ts resumo.md)" >> "$GITHUB_OUTPUT"
        env:
          # Mesmo token restrito da indexação (D1 e Vectorize); só lê.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_INDEXACAO }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      - name: Fechar o resumo anterior e abrir o novo
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: ${{ steps.montar.outputs.titulo }}
        run: |
          for n in $(gh issue list --state open --search 'in:title "Resumo semanal do assistente"' --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Substituído pelo resumo desta semana."
          done
          gh issue create --title "$TITULO" --body-file resumo.md

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
