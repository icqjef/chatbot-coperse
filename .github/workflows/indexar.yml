name: indexar

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos itens processar nesta execução'
        default: '400'
      minutos:
        description: 'Prazo do rastreamento, em minutos'
        default: '25'

concurrency:
  group: indexacao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx worker-indexacao/src/principal.ts
        env:
          # Transitório: remover o "|| secrets.CLOUDFLARE_API_TOKEN" assim que o segredo CLOUDFLARE_API_TOKEN_INDEXACAO
          # (token restrito a D1 Edit + Vectorize Edit) existir.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_INDEXACAO || secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          VECTORIZE_INDICE: ${{ vars.VECTORIZE_INDICE }}
          LIMITE: ${{ inputs.limite || '400' }}
          PRAZO_MINUTOS: ${{ inputs.minutos || '25' }}
          TETO_VETORES: '6000'

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
