name: indexar

on:
  schedule:
    # Fora da hora cheia: o GitHub atrasa ou descarta mais os agendamentos no minuto 0.
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      limite:
        description: 'Quantos itens processar nesta execução'
        default: '400'
      minutos:
        description: 'Prazo do rastreamento, em minutos'
        default: '25'

concurrency:
  group: indexacao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx worker-indexacao/src/principal.ts
        env:
          # Token restrito a D1 Edit + Vectorize Edit; o token que publica Workers fica só no publicar.yml.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_INDEXACAO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          VECTORIZE_INDICE: ${{ vars.VECTORIZE_INDICE }}
          LIMITE: ${{ inputs.limite || '400' }}
          PRAZO_MINUTOS: ${{ inputs.minutos || '25' }}
          TETO_VETORES: '6000'

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1
